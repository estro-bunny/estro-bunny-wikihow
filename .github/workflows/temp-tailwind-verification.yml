name: Temporary Tailwind verification

on:
  push:
    branches:
      - test/known-good-baseline
    paths-ignore:
      - package-lock.json

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify install
        run: npm ci --ignore-scripts

      - name: Install Playwright for verification
        run: npm install --no-save --ignore-scripts @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run homepage smoke test
        run: npx playwright test tests/smoke/homepage.spec.js

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: update lockfile for Tailwind"
            git push
          fi
