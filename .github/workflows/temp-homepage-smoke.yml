name: Temporary homepage smoke verification

on:
  push:
    branches:
      - test/known-good-baseline

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright for verification
        run: npm install --no-save --ignore-scripts @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run homepage smoke test
        run: npx playwright test tests/smoke/homepage.spec.js
