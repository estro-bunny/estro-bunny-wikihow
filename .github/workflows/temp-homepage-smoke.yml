name: Temporary homepage smoke verification

on:
  push:
    branches:
      - test/known-good-baseline

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/smoke/homepage.spec.js
